    }
    .card button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* 6. Main Stage Area */
    .stage {
      flex: 1;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 78%, rgba(235,112,37,.16), transparent 36%), linear-gradient(180deg, #080b18 0%, #171322 50%, #24151b 78%, #100d11 100%) !important;
    }
    .stage:before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;

    }
    .stage:after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 24%;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(8,7,9,.88)), repeating-linear-gradient(90deg, transparent 0 7%, rgba(255,180,95,.035) 7.2% 7.5%, transparent 7.8% 13%);

    canvas#fx {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: block;
    }

    .stage .stars, .stage .greeting, .stage .horizon, .stage .ground, .stage .status {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }
    
    .wizzy-watermark {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.12);
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 4px;
      pointer-events: none;
      z-index: 20;
      text-transform: uppercase;
    }

    .desi-toran {
      position: absolute;
      z-index: 12;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      pointer-events: none;
      opacity: .9;
      background: radial-gradient(ellipse at 8% 100%, #e7a33c 0 4px, transparent 5px), radial-gradient(ellipse at 20% 100%, #e7a33c 0 4px, transparent 5px), radial-gradient(ellipse at 32% 100%, #e7a33c 0 4px, transparent 5px), radial-gradient(ellipse at 44% 100%, #e7a33c 0 4px, transparent 5px), radial-gradient(ellipse at 56% 100%, #e7a33c 0 4px, transparent 5px), radial-gradient(ellipse at 68% 100%, #e7a33c 0 4px, transparent 5px), radial-gradient(ellipse at 80% 100%, #e7a33c 0 4px, transparent 5px), radial-gradient(ellipse at 92% 100%, #e7a33c 0 4px, transparent 5px), linear-gradient(180deg, #b75a2a 0 3px, transparent 3px);

      letter-spacing: clamp(3px, 2vw, 18px);
      text-shadow: 0 0 12px #ff9d24;
    }
    .desi-greeting {
      position: absolute;
      z-index: 12;
      top: clamp(72px, 13%, 120px);
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      color: #ffe4ad;
      font: 600 clamp(12px, 1.4vw, 16px) 'Yatra One', serif;
      letter-spacing: .08em;
      text-shadow: 0 2px 12px #ff8d32;

    .stage .greeting h1 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      color: #fff0cf !important;
      text-shadow: 0 3px 24px #ff9c43a6, 0 2px 3px #000 !important;
      font-size: clamp(2rem, 5vw, 4rem);
      text-align: center;
      z-index: 11;
      pointer-events: none;
    }
    .stage .greeting h1 em { color: #ffc45c !important; font-style: normal; }
    
    .desi-diyas {
      position: absolute;
      z-index: 12;
      left: 0;
      right: 0;
      bottom: 10px;

      justify-content: space-around;
      pointer-events: none;
      font-size: clamp(20px, 3vw, 34px);

    .desi-diyas span { animation: diyaFlicker 2.1s ease-in-out infinite alternate; }
    .desi-diyas span:nth-child(2n) { animation-delay: -.8s; }

      0% { opacity: .78; transform: translateY(1px) scale(.96); filter: brightness(.9); }
      100% { opacity: 1; transform: translateY(-2px) scale(1.04); filter: brightness(1.25); }

      opacity: .28;
      background: repeating-conic-gradient(from 0deg, #e8a54a 0deg 2deg, transparent 2deg 15deg);
      mask: radial-gradient(circle, transparent 0 22%, #000 23% 25%, transparent 26% 34%, #000 35% 37%, transparent 38% 48%, #000 49% 51%, transparent 52%);

    @media (max-width: 768px) {

        overflow-x: auto;
        overflow-y: hidden;
        border-right: none;
        border-bottom: 2px solid rgba(144, 238, 144, 0.3);
        padding: 12px;
        gap: 12px;
      }
      .sidebar-header { display: none; }
      .cards {
        flex-direction: row;
        padding-bottom: 8px;
      }
      .card {
        min-width: 140px;
        flex-shrink: 0;
        flex-direction: column;
        text-align: center;
        padding: 10px;
      }
      .card img { width: 50px; height: 50px; }
      .card-info { width: 100%; }
      .card button { width: 100%; padding: 6px; font-size: 0.8rem; }
      .stage { height: 60vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .desi-diyas span { animation: none !important; }
      .card { transition: none !important; }
    }
  </style>

      <!-- Main Stage Area -->
      <main class="stage" id="stage">
        <div class="wizzy-watermark" aria-hidden="true">BY WIZZY</div>
        <div class="desi-toran" aria-hidden="true"></div>
        <div class="desi-greeting" aria-hidden="true">शुभ दीपावली</div>
        <div class="desi-rangoli" aria-hidden="true"></div>
        <div class="desi-diyas" aria-hidden="true">
          <span>🪔</span><span>🪔</span><span></span><span>🪔</span><span>🪔</span>
        </div>
        <div class="stars"></div>
        <div class="greeting"><h1>Happy <em>Diwali</em>!</h1></div>
        <div class="horizon"></div>
        <div class="ground" aria-hidden="true"></div>
        
        <!-- Canvas fills the stage -->
        <canvas id="fx"></canvas>
        
        <div class="status" aria-live="polite" style="position:absolute; top:10px; left:10px; z-index:15; color:#aaa; font-size:0.8rem;"></div>
      </main>

  </div>

  <!-- JavaScript Logic -->
  <script>
    (function() {
      const stage = document.querySelector('#stage');
      const canvas = document.querySelector('#fx');
      if (!stage || !canvas) return;
      const ctx = canvas.getContext('2d');

      let W = 0, H = 0, dpr = 1;
      let particles = [], effects = [], flashes = [], floatingTexts = [];
      let sound = true, audio = null, master = null, noiseBuffer = null;
      let queue = [], clock = 0, audioUntil = 0;
      let lightAllRunning = false, lightAllAbortId = 0;
      let bestSalvoRunning = false, bestSalvoAbortId = 0;
      const sprites = new Map();

      const R = (a, b) => a + Math.random() * (b - a);
      const gold = ['#fff8db', '#ffdf93', '#ffb64d', '#ffe8b4'];
      const palettes = [
        ['#ff0055', '#ffe600'], ['#00e5ff', '#a855f7'], ['#00ff66', '#ffffff'],
        ['#ff8800', '#ffd700'], ['#e60aff', '#ff0043'], ['#ffd15c', '#ffffff'],
        ['#fda7c8', '#ff548a'], ['#b5d8ff', '#6e9aff'], ['#d2bbff', '#a87cff'], ['#b7ffe5', '#57dba3']
      ];

      function resize() {
        if (!stage || !canvas) return;
        const b = stage.getBoundingClientRect();
        W = b.width;
        H = b.height;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      const ro = new ResizeObserver(resize);
      ro.observe(stage);
      window.addEventListener('resize', resize);
      resize();

      async function unlockAudio() {
        try {
          audio = audio || new (window.AudioContext || window.webkitAudioContext)();
          if (!master) {
            master = audio.createGain();
            master.gain.value = sound ? 0.8 : 0;
            const limiter = audio.createDynamicsCompressor();
            limiter.threshold.value = -12;
            limiter.ratio.value = 5;
            master.connect(limiter);
            limiter.connect(audio.destination);

            noiseBuffer = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
            const data = noiseBuffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
              data[i] = Math.random() * 2 - 1;
            }
          }
          if (audio.state !== 'running') {
            await audio.resume();
          }
        } catch (error) {
          const status = document.querySelector('.status');
          if (status) status.textContent = 'Sound unavailable in this browser.';
        }
      }

      function noise(duration = 0.5, frequency = 1100, volume = 0.12, type = 'hiss', startOffset = 0) {
        if (!sound || !audio || audio.state !== 'running' || !master) return;
        const t = audio.currentTime + Math.max(0, startOffset);
        const src = audio.createBufferSource();
        const filter = audio.createBiquadFilter();
        const gain = audio.createGain();

        src.buffer = noiseBuffer;
        src.loop = true;
        filter.type = type === 'boom' ? 'lowpass' : 'bandpass';
        filter.frequency.setValueAtTime(frequency, t);
        filter.Q.value = type === 'whistle' ? 4 : 0.7;

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.exponentialRampToValueAtTime(volume, t + 0.015);
        if (type === 'hiss') {
          for (let i = 1; i < duration * 12; i++) {
            gain.gain.linearRampToValueAtTime(volume * (0.65 + Math.random() * 0.35), t + i / 12);
          }
        }
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);

        src.connect(filter);
        filter.connect(gain);
        gain.connect(master);
        src.start(t);
        src.stop(t + duration + 0.03);
        src.onended = () => { src.disconnect(); filter.disconnect(); gain.disconnect(); };
        audioUntil = Math.max(audioUntil, clock + duration * 60);
      }

      function tone(startHz, endHz, duration, volume, wave = 'sine') {
        if (!sound || !audio || audio.state !== 'running' || !master) return;
        const t = audio.currentTime;
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = wave;
        o.frequency.setValueAtTime(startHz, t);
        o.frequency.exponentialRampToValueAtTime(endHz, t + duration);
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(volume, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, t + duration);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + duration + 0.02);
        o.onended = () => { o.disconnect(); g.disconnect(); };
        audioUntil = Math.max(audioUntil, clock + duration * 60);
      }

      function echoTone(freq, duration = 0.28, volume = 0.035) {
        if (!sound || !audio || audio.state !== 'running' || !master) return;
        const t = audio.currentTime;
        const osc = audio.createOscillator();
        const env = audio.createGain();
        const delay = audio.createDelay(0.8);
        const feedback = audio.createGain();
        const wet = audio.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(Math.max(45, freq * 0.72), t + duration);
        env.gain.setValueAtTime(0.0001, t);
        env.gain.exponentialRampToValueAtTime(volume, t + 0.012);
        env.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        delay.delayTime.value = 0.19; feedback.gain.value = 0.22; wet.gain.value = 0.24;
        osc.connect(env); env.connect(master); env.connect(delay);
        delay.connect(feedback); feedback.connect(delay); delay.connect(wet); wet.connect(master);
        osc.start(t); osc.stop(t + duration + 0.03);
        osc.onended = () => { osc.disconnect(); env.disconnect(); delay.disconnect(); feedback.disconnect(); wet.disconnect(); };
        audioUntil = Math.max(audioUntil, clock + duration * 60 + 24);
      }

      function crackle(duration = 0.8, density = 18, volume = 0.07) {
        if (!sound || !audio || audio.state !== 'running' || !master) return;
        for (let i = 0; i < density; i++) {
          const delay = Math.random() * duration;
          const len = 0.018 + Math.random() * 0.035;
          noise(len, 2600 + Math.random() * 3600, volume * (0.35 + Math.random() * 0.65), 'boom', delay);
        }
      }

      function soundEffect(kind) {
        if (kind === 'sparkler') { noise(3.0, 5100, 0.13, 'hiss'); noise(2.7, 2400, 0.055, 'hiss'); crackle(2.4, 26, 0.035); }
        if (kind === 'fountain') { noise(3.3, 1500, 0.20, 'hiss'); noise(3.0, 3900, 0.10, 'hiss'); tone(95, 180, 2.8, 0.025, 'triangle'); crackle(2.7, 18, 0.035); }
        if (kind === 'spinner') { noise(3.0, 2800, 0.15, 'hiss'); tone(360, 1050, 2.8, 0.035, 'triangle'); tone(1050, 620, 2.2, 0.018, 'sine'); }
        if (kind === 'rocket' || kind === 'shell') { noise(1.35, 1700, 0.11, 'whistle'); tone(280, 1550, 1.25, 0.045, 'sine'); tone(110, 260, 1.0, 0.025, 'triangle'); }
        if (kind === 'burst') { noise(0.11, 4200, 0.24, 'boom'); noise(0.95, 420, 0.25, 'boom'); tone(105, 42, 0.62, 0.19, 'sine'); noise(0.75, 2600, 0.07, 'hiss'); echoTone(190, 0.48, 0.035); crackle(0.8, 22, 0.055); }
        if (kind === 'bestLift') { noise(1.25, 1900, 0.14, 'whistle'); tone(260, 1750, 1.25, 0.06, 'sine'); tone(125, 420, 1.2, 0.035, 'triangle'); }
        if (kind === 'bestBurst') { noise(0.14, 4800, 0.32, 'boom'); noise(1.45, 360, 0.38, 'boom'); tone(125, 28, 1.0, 0.28, 'sine'); noise(1.0, 3000, 0.12, 'hiss'); echoTone(145, 0.85, 0.07); crackle(1.35, 34, 0.065); }
        if (kind === 'bestCrackle') { noise(0.07, 3900, 0.20, 'boom'); tone(1600, 650, 0.055, 0.018, 'triangle'); }
      }

      function schedule(kind, delay = 0, posX = null, extras = null) {
        queue.push({ kind, due: clock + delay, posX, extras });
        stage.classList.add('active');
      }

      function syncStage() {
        stage.classList.toggle('active', Boolean(lightAllRunning || bestSalvoRunning || effects.length || particles.length || flashes.length || floatingTexts.length || queue.length || (sound && clock < audioUntil)));
      }

      function sprite(color) {
        if (sprites.has(color)) return sprites.get(color);
        const c = document.createElement('canvas');
        c.width = c.height = 24;
        const g = c.getContext('2d');
        const rad = g.createRadialGradient(12, 12, 0, 12, 12, 12);
        rad.addColorStop(0, '#fff9e5');
        rad.addColorStop(0.15, color);
        rad.addColorStop(1, 'transparent');
        g.fillStyle = rad;
        g.fillRect(0, 0, 24, 24);
        sprites.set(color, c);
        return c;
      }

      function particle(x, y, vx, vy, color, life = 65, size = 1.4, gravity = 0.045, extras = {}) {
        if (particles.length > 2500) return;
        particles.push(Object.assign({ x, y, px: x, py: y, vx, vy, color, life, max: life, size, gravity }, extras));
      }

      function burst(x, y) {
        const pal = palettes[Math.floor(R(0, palettes.length))];
        const scale = Math.min(1, W / 650, H / 550);
        flashes.push({ x, y, life: 12, max: 12, color: pal[0] });
        
        // Enhanced Smoke Effect for Bomb/Burst
        for (let i = 0; i < 50; i++) {
          const a = R(0, Math.PI * 2);
          const v = R(0.5, 3.0) * scale;
          particle(x + R(-15, 15), y + R(-15, 15), Math.cos(a) * v, Math.sin(a) * v - R(0.5, 1.5), '#999999', R(80, 150), R(5, 12), 0.005, { smoke: true });
        }
        
        for (let i = 0; i < 24; i++) {
          const a = R(0, Math.PI * 2);
          const v = R(0.4, 2.1) * scale;
          particle(x, y, Math.cos(a) * v, Math.sin(a) * v, '#d9c6ad', R(38, 70), R(2.0, 3.6), 0.012, { smoke: true });
        }
        for (let i = 0; i < 180; i++) {
          const a = i * Math.PI * 2 / 180 + R(-0.025, 0.025);
          const speed = R(4.5, 8.0) * scale;
          particle(x, y, Math.cos(a) * speed, Math.sin(a) * speed, pal[i % 2], R(85, 135), R(0.8, 1.8), 0.025);
        }
        for (let i = 0; i < 60; i++) {
          const a = R(0, Math.PI * 2);
          const v = R(0.3, 3) * scale;
          particle(x, y, Math.cos(a) * v, Math.sin(a) * v, gold[i % 4], R(40, 90), R(0.7, 1.5), 0.025);
        }
        soundEffect('burst');
      }

      function createSphereBurst(x, y, count, color, speedBase = 6.5) {
        const R_val = 0.5 * Math.sqrt(count / Math.PI);
        const C = 2 * R_val * Math.PI;
        const C_HALF = Math.floor(C / 2);
        for (let i = 0; i <= C_HALF; i++) {
          const ringAngle = (i / (C_HALF || 1)) * (Math.PI / 2);
          const ringSize = Math.cos(ringAngle);
          const parts = Math.max(1, Math.round(C * ringSize));
          const angleInc = (Math.PI * 2) / parts;
          for (let j = 0; j < parts; j++) {
            const angle = j * angleInc + (Math.random() - 0.5) * 0.15;
            const speed = speedBase * ringSize * R(0.85, 1.15);
            particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color, R(75, 125), R(1.2, 2.2), 0.025);
          }
        }
      }

      const BEST_SHELLS = ['Chrysanthemum', 'Willow', 'Crossette', 'Ring', 'Palm', 'Strobe', 'Crackle'];
      let bestShellIdx = 0;
      let previousSkyshotsPalette = -1;

      function burstSkyshots(x, y, paletteIndex) {
        const pal = palettes[paletteIndex];
        const scale = Math.min(1, W / 650, H / 550);
        flashes.push({ x, y, life: 18, max: 18, color: pal[0] });

        // Enhanced Smoke for Skyshots
        for (let i = 0; i < 60; i++) {
          const a = R(0, Math.PI * 2);
          const v = R(0.35, 1.8) * scale;
          particle(x + R(-7, 7), y + R(-7, 7), Math.cos(a) * v, Math.sin(a) * v - R(0.1, 0.8), '#aaaaaa', R(65, 105), R(5, 10), 0.006, { smoke: true });
        }

        createSphereBurst(x, y, 175, pal[0], 7.4 * scale);
        for (let i = 0; i < 65; i++) {
          const a = R(0, Math.PI * 2);
          const v = R(1.0, 4.0) * scale;
          particle(x, y, Math.cos(a) * v, Math.sin(a) * v, pal[i % pal.length], R(48, 95), R(1.0, 2.0), 0.027);
        }
        for (let i = 0; i < 38; i++) {
          const a = R(0, Math.PI * 2);
          const v = R(2.0, 6.0) * scale;
          particle(x, y, Math.cos(a) * v, Math.sin(a) * v, gold[i % gold.length], R(55, 105), R(0.8, 1.5), 0.035, { crackle: true });
        }
        soundEffect('bestBurst');
      }

      function launchSkyshots(x) {
        let paletteIndex;
        do {
          paletteIndex = Math.floor(R(0, palettes.length));
        } while (paletteIndex === previousSkyshotsPalette);
        previousSkyshotsPalette = paletteIndex;

        const targetY = H * R(0.17, 0.31);
        effects.push({
          kind: 'best-rocket', shellType: 'Chrysanthemum', skyshots: true,
          paletteIndex, x, y: H - 38, start: H - 38, t: 0, d: 88,
          target: targetY, drift: R(-0.15, 0.15)
        });
        soundEffect('bestLift');
      }

      function burstBestFirework(x, y, shellType) {
        const pal = palettes[Math.floor(R(0, palettes.length))];
        const scale = Math.min(1, W / 650, H / 550);
        flashes.push({ x, y, life: 18, max: 18, color: pal[0] });
        soundEffect('bestBurst');

        // Enhanced Smoke for Best Firecrackers
        for (let i = 0; i < 55; i++) {
          const a = R(0, Math.PI * 2);
          const v = R(0.5, 2.5) * scale;
          particle(x + R(-10, 10), y + R(-10, 10), Math.cos(a) * v, Math.sin(a) * v - R(0.3, 1.2), '#888888', R(70, 130), R(6, 14), 0.005, { smoke: true });
        }

        if (shellType === 'Chrysanthemum') {
          createSphereBurst(x, y, 120, pal[0], 7.2 * scale);
          for (let i = 0; i < 40; i++) {
            const a = R(0, Math.PI * 2);
            const v = R(1.2, 3.2) * scale;
            particle(x, y, Math.cos(a) * v, Math.sin(a) * v, pal[1] || gold[i % 4], R(45, 80), R(1.2, 2.0), 0.025);
          }
        } else if (shellType === 'Willow') {
          for (let i = 0; i < 110; i++) {
            const a = R(0, Math.PI * 2);
            const v = R(2.4, 6.2) * scale;
            particle(x, y, Math.cos(a) * v, Math.sin(a) * v * 0.75, gold[i % 4], R(140, 210), R(1.4, 2.2), 0.034, { willow: true });
          }
        } else if (shellType === 'Crossette') {
          for (let i = 0; i < 14; i++) {
            const a = (i / 14) * Math.PI * 2 + R(-0.08, 0.08);
            const v = R(5.2, 7.8) * scale;
            particle(x, y, Math.cos(a) * v, Math.sin(a) * v, pal[i % 2], R(65, 75), R(1.8, 2.5), 0.028, { crossette: true });
          }
        } else if (shellType === 'Ring') {
          const tilt = R(0.35, 0.65);
          const ringColor = pal[0];
          const pistilColor = pal[1] || '#ffffff';
          for (let i = 0; i < 65; i++) {
            const a = (i / 65) * Math.PI * 2;
            const v = 6.2 * scale;
            particle(x, y, Math.cos(a) * v, Math.sin(a) * v * tilt, ringColor, R(85, 115), 1.8, 0.022);
          }
          for (let i = 0; i < 30; i++) {
            const a = R(0, Math.PI * 2);
            const v = R(1.0, 2.8) * scale;
            particle(x, y, Math.cos(a) * v, Math.sin(a) * v, pistilColor, R(40, 75), 1.4, 0.025);
          }
        } else if (shellType === 'Palm') {
          for (let i = 0; i < 18; i++) {
            const a = (i / 18) * Math.PI * 2 + R(-0.06, 0.06);
            const v = R(4.5, 7.5) * scale;
            for (let j = 0; j < 6; j++) {
              const subSpeed = v * (0.6 + j * 0.08);
              particle(x, y, Math.cos(a) * subSpeed, Math.sin(a) * subSpeed, '#ffd700', R(90, 150), R(1.3, 2.0), 0.045, { willow: true });
            }
          }
        } else if (shellType === 'Strobe') {
          for (let i = 0; i < 100; i++) {
            const a = R(0, Math.PI * 2);
            const v = R(4.0, 7.5) * scale;
            particle(x, y, Math.cos(a) * v, Math.sin(a) * v, pal[i % 2], R(90, 130), R(1.3, 2.2), 0.025, { strobe: true, phase: R(0, Math.PI * 2) });
          }
        } else {
          for (let i = 0; i < 100; i++) {
            const a = R(0, Math.PI * 2);
            const v = R(4.5, 8.0) * scale;
            particle(x, y, Math.cos(a) * v, Math.sin(a) * v, gold[i % 4], R(55, 85), R(1.2, 2.0), 0.028, { crackle: true });
          }
        }
      }

      function launchSingleBestRocket(x, shellType, targetY = null) {
        stage.classList.add('active');
        const destY = targetY !== null ? targetY : H * R(0.20, 0.34);
        effects.push({ kind: 'best-rocket', shellType, x, y: H - 38, start: H - 38, t: 0, d: 85, target: destY, drift: R(-0.15, 0.15) });
        soundEffect('bestLift');
      }

      function launchBestFirework() {
        stage.classList.add('active');
        const bestBtn = document.querySelector('[data-kind="best-fireworks"]');
        if (bestBtn) { bestBtn.disabled = true; bestBtn.textContent = 'Launching..'; }
        bestSalvoRunning = true;
        const currentSalvoId = ++bestSalvoAbortId;

        const padding = Math.max(50, W * 0.12);
        const available = Math.max(100, W - 2 * padding);
        const positions = [
          Math.round(padding + available * 0.18), Math.round(padding + available * 0.82),
          Math.round(padding + available * 0.36), Math.round(padding + available * 0.64), Math.round(W * 0.5)
        ];
        const shells = [
          BEST_SHELLS[bestShellIdx % BEST_SHELLS.length], BEST_SHELLS[(bestShellIdx + 1) % BEST_SHELLS.length],
          BEST_SHELLS[(bestShellIdx + 2) % BEST_SHELLS.length], BEST_SHELLS[(bestShellIdx + 3) % BEST_SHELLS.length], 'Crackle'
        ];
        bestShellIdx = (bestShellIdx + 4) % BEST_SHELLS.length;
        const targets = [ H * R(0.26, 0.34), H * R(0.26, 0.34), H * R(0.22, 0.30), H * R(0.22, 0.30), H * R(0.15, 0.22) ];
        const intervalFrames = 72;

        for (let i = 0; i < 5; i++) {
          schedule('best-single-rocket', i * intervalFrames, positions[i], { shellType: shells[i], targetY: targets[i] });
        }

        setTimeout(() => {
          if (bestSalvoAbortId === currentSalvoId) {
            bestSalvoRunning = false;
            if (bestBtn) { bestBtn.disabled = false; bestBtn.textContent = 'Launch'; }
            syncStage();
          }
        }, 8200);
      }

      let spawnSeq = 0, lastChosenX = null;
      const slotMultipliers = [0, 1, -1, 2, -2, 0.6, -0.6, 1.4, -1.4, 2.4, -2.4];

      function getFireworkPosition(kind) {
        const padding = Math.max(55, W * 0.12);
        const available = Math.max(100, W - 2 * padding);
        const step = Math.min(140, Math.max(65, available / 5));
        const center = W * 0.5;
        const minDistance = step * 0.78;
        const candidates = [];
        for (let i = 0; i < slotMultipliers.length; i++) {
          const cand = center + slotMultipliers[i] * step;
          if (cand >= padding && cand <= W - padding) candidates.push(Math.round(cand));
        }
        if (candidates.length === 0) candidates.push(center);

        const activeEffects = effects.filter(e => e.t < e.d && e.x !== undefined);
        let chosen = null;
        for (let i = 0; i < candidates.length; i++) {
          const idx = (spawnSeq + i) % candidates.length;
          const cand = candidates[idx];
          const collides = activeEffects.some(e => Math.abs(e.x - cand) < minDistance);
          const isRepeatOfLast = lastChosenX !== null && Math.abs(cand - lastChosenX) < (minDistance * 0.5);
          if (!collides && (!isRepeatOfLast || (activeEffects.length === 0 && candidates.length <= 1))) {
            chosen = cand; spawnSeq = (idx + 1) % candidates.length; lastChosenX = chosen; break;
          }
        }
        if (chosen === null) {
          let maxDist = -1, bestCand = candidates[0];
          for (let i = 0; i < candidates.length; i++) {
            const cand = candidates[i];
            const dist = activeEffects.length > 0 ? Math.min(...activeEffects.map(e => Math.abs(cand - e.x))) : 999;
            if (dist > maxDist) { maxDist = dist; bestCand = cand; }
          }
          chosen = bestCand; lastChosenX = chosen; spawnSeq = (spawnSeq + 1) % candidates.length;
        }
        return chosen;
      }

      function projectile(kind, targetX = null) {
        const x = targetX !== null ? targetX : (W * 0.5);
        effects.push({ kind, x, y: H - 38, start: H - 38, t: 0, d: 90, target: H * R(0.2, 0.35), drift: R(-0.25, 0.25) });
        soundEffect(kind);
      }

      function launch(kind, forcedX = null) {
        stage.classList.add('active');
        const y = H - 55;
        const x = forcedX !== null ? forcedX : getFireworkPosition(kind);

        if (kind === 'jhirjhire') { effects.push({ kind: 'sparkler', x, y: y - 105, t: 0, d: 190 }); soundEffect('sparkler'); }
        if (kind === 'fountain') { effects.push({ kind: 'fountain', x, y, t: 0, d: 210 }); soundEffect(kind); }
        if (kind === 'spinner') { effects.push({ kind: 'spinner', x, y: y - 18, t: 0, d: 180 }); soundEffect(kind); }
        if (kind === 'rocket') { projectile('rocket', x); }
        if (kind === 'firework') {
          const spread = Math.min(100, Math.max(50, W * 0.14));
          schedule('shell', 0, x - spread); schedule('shell', 39, x + spread); schedule('shell', 78, x);
        }
        if (kind === 'best-fireworks') { launchBestFirework(x); }
        if (kind === 'skyshots') { launchSkyshots(x); }
        if (kind === 'happy-diwali') {
          effects.push({ kind: 'happy-rocket', x, y: H - 38, start: H - 38, t: 0, d: 95, target: H * R(0.25, 0.35), drift: R(-0.1, 0.1) });
          soundEffect('bestLift');
        }
      }

      function glow(x, y, radius, color) {
        const rad = ctx.createRadialGradient(x, y, 0, x, y, radius);
        rad.addColorStop(0, color); rad.addColorStop(1, 'transparent');
        ctx.fillStyle = rad; ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
      }

      function effect(e, dt) {
        e.t += dt;
        const progress = Math.min(1, e.t / e.d);
        const strength = Math.sin(progress * Math.PI);

        if (e.kind === 'sparkler') {
          const x = e.x, y = e.y;
          ctx.strokeStyle = '#9e8c75'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 80); ctx.stroke();
          glow(x, y, 65, 'rgba(255, 179, 72, 0.22)');
          ctx.fillStyle = '#fff9e4'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
          for (let j = 0; j < 16 * strength * dt; j++) {
            const a = R(0, Math.PI * 2), v = R(1.5, 7);
            particle(x, y, Math.cos(a) * v, Math.sin(a) * v, gold[j % 4], R(12, 35), R(0.5, 1.5), 0.06);
          }
        }
        if (e.kind === 'fountain') {
          const x = e.x, y = e.y;
          glow(x, y - 30, 120, 'rgba(255, 174, 51, 0.15)');
          ctx.save(); ctx.translate(x, y);
          const g = ctx.createLinearGradient(-28, 0, 28, 0);
          g.addColorStop(0, '#73351f'); g.addColorStop(0.45, '#de9053'); g.addColorStop(1, '#85452c');
          ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-13, -22); ctx.bezierCurveTo(-42, -12, -35, 19, -22, 21);
          ctx.lineTo(22, 21); ctx.bezierCurveTo(35, 19, 42, -12, 13, -22); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#e9b373'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, -21, 14, 4, 0, 0, Math.PI * 2); ctx.stroke();
          ctx.strokeStyle = '#f2c47a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 8, 30, 6, 0, 0, Math.PI); ctx.stroke();
          ctx.restore();
          for (let j = 0; j < 15 * strength * dt; j++) {
            const a = R(-0.32, 0.32), v = R(4, 12) * Math.min(1, H / 450);
            particle(x + R(-5, 5), y - 23, Math.sin(a) * v, -Math.cos(a) * v, gold[j % 4], R(40, 75), R(0.6, 1.7), 0.105);
          }
        }
        if (e.kind === 'spinner') {
          const x = e.x + Math.sin(e.t * 0.08) * 5, y = e.y;
          glow(x, y, 95, 'rgba(255, 162, 53, 0.15)');
          ctx.save(); ctx.translate(x, y); ctx.scale(1, 0.4);
          ctx.fillStyle = '#773c2c'; ctx.beginPath(); ctx.arc(0, 0, 31, 0, Math.PI * 2); ctx.fill();
          for (let r = 8; r < 31; r += 5) {
            ctx.strokeStyle = r % 2 ? '#c66a39' : '#e8b870'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
          }
          ctx.fillStyle = '#f9d38a'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          for (let j = 0; j < 15 * strength * dt; j++) {
            const a = e.t * 0.46 + R(-0.15, 0.15);
            const vx = -Math.sin(a) * R(5, 10), vy = Math.cos(a) * R(1, 3);
            particle(x + Math.cos(a) * 28, y + Math.sin(a) * 11, vx, vy - R(0.2, 2), gold[j % 4], R(20, 43), R(0.6, 1.7), 0.055);
          }
        }
        if (e.kind === 'rocket' || e.kind === 'shell') {
          const t = Math.min(1, e.t / e.d);
          e.y = e.start + (e.target - e.start) * (1 - Math.pow(1 - t, 1.55));
          e.x += e.drift * dt;
          glow(e.x, e.y + 15, 32, 'rgba(255, 182, 53, 0.22)');
          
          // Enhanced Smoke Trail for Rocket
          for (let j = 0; j < 8 * dt; j++) {
            particle(e.x + R(-3, 3), e.y + 15, R(-1, 1), R(1, 4), '#888888', R(40, 80), R(3, 6), 0.008, { smoke: true });
          }
          
          ctx.save(); ctx.translate(e.x, e.y);
          if (e.kind === 'rocket') {
            ctx.fillStyle = '#f7c36e'; ctx.fillRect(-6, -11, 12, 25);
            ctx.fillStyle = '#c84b56'; ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(-8, -10); ctx.lineTo(8, -10); ctx.closePath(); ctx.fill();
            ctx.fillRect(-6, -5, 12, 4);
            ctx.strokeStyle = '#aa8f6f'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(1, 14); ctx.lineTo(1, 49); ctx.stroke();
          } else {
            ctx.fillStyle = '#fff3cb'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
          if (e.t >= e.d && !e.done) { e.done = true; burst(e.x, e.y); }
        }
        if (e.kind === 'best-rocket') {
          const t = Math.min(1, e.t / e.d);
          e.y = e.start + (e.target - e.start) * (1 - Math.pow(1 - t, 1.6));
          e.x += e.drift * dt;
          glow(e.x, e.y + 16, 38, 'rgba(255, 215, 0, 0.28)');
          
          // Enhanced Smoke Trail for Best Rocket
          for (let j = 0; j < 10 * dt; j++) {
            particle(e.x + R(-4, 4), e.y + 16, R(-1.5, 1.5), R(1.5, 5.5), '#aaaaaa', R(50, 100), R(4, 8), 0.006, { smoke: true });
          }
          
          ctx.save(); ctx.translate(e.x, e.y);
          ctx.fillStyle = '#ffd700'; ctx.fillRect(-6, -12, 12, 26);
          ctx.fillStyle = '#ff3366'; ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(-9, -11); ctx.lineTo(9, -11); ctx.closePath(); ctx.fill();
          ctx.fillRect(-7, -6, 14, 5);
          ctx.strokeStyle = '#e6c280'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(1, 14); ctx.lineTo(1, 52); ctx.stroke();
          ctx.restore();
          if (e.t >= e.d && !e.done) {
            e.done = true;
            if (e.skyshots) burstSkyshots(e.x, e.y, e.paletteIndex);
            else burstBestFirework(e.x, e.y, e.shellType);
          }
        }
        if (e.kind === 'happy-rocket') {
          const t = Math.min(1, e.t / e.d);
          e.y = e.start + (e.target - e.start) * (1 - Math.pow(1 - t, 1.6));
          e.x += e.drift * dt;
          glow(e.x, e.y + 16, 38, 'rgba(255, 215, 0, 0.28)');
          
          // Heavy smoke trail for Happy Diwali rocket
          for (let j = 0; j < 12 * dt; j++) {
            particle(e.x + R(-4, 4), e.y + 16, R(-1.5, 1.5), R(1.5, 5.5), '#999999', R(60, 120), R(5, 10), 0.005, { smoke: true });
          }
          
          ctx.save(); ctx.translate(e.x, e.y);
          ctx.fillStyle = '#ffd700'; ctx.fillRect(-6, -12, 12, 26);
          ctx.fillStyle = '#ff3366'; ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(-9, -11); ctx.lineTo(9, -11); ctx.closePath(); ctx.fill();
          ctx.fillRect(-7, -6, 14, 5);
          ctx.strokeStyle = '#e6c280'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(1, 14); ctx.lineTo(1, 52); ctx.stroke();
          ctx.restore();
          
          if (e.t >= e.d && !e.done) {
            e.done = true;
            burst(e.x, e.y); // Standard burst with enhanced smoke
            // Add Happy Diwali 2083 floating text
            floatingTexts.push({ x: e.x, y: e.y - 40, text: "Happy Diwali 2083", life: 240, maxLife: 240 });
            soundEffect('bestBurst');
          }
        }
      }

      let previous = 0;
      function frame(now) {
        const dt = Math.min(6, (now - previous) / 16.667 || 1);
        previous = now; clock += dt;

        const ready = queue.filter(item => item.due <= clock);
        queue = queue.filter(item => item.due > clock);
        for (const item of ready) {
          if (item.kind === 'shell') { projectile('shell', item.posX); }
          else if (item.kind === 'best-single-rocket') {
            const shellType = item.extras ? item.extras.shellType : 'Chrysanthemum';
            const targetY = item.extras ? item.extras.targetY : null;
            launchSingleBestRocket(item.posX, shellType, targetY);
          } else { launch(item.kind, item.posX); }
        }

        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'source-over';
        for (const e of effects) effect(e, dt);
        effects = effects.filter(e => e.t < e.d);

        ctx.globalCompositeOperation = 'lighter';
        for (const f of flashes) {
          glow(f.x, f.y, 180, f.color + Math.round(f.life / f.max * 45).toString(16).padStart(2, '0'));
          f.life -= dt;
        }
        flashes = flashes.filter(f => f.life > 0);

        ctx.lineCap = 'round';
        for (const p of particles) {
          p.px = p.x; p.py = p.y;
          p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.y > H - 24) { p.y = H - 24; p.vy = -Math.abs(p.vy) * 0.18; p.vx *= 0.87; p.life = Math.min(p.life, 15); }
          p.vx *= Math.pow(0.985, dt); p.vy = p.vy * Math.pow(0.989, dt) + p.gravity * dt; p.life -= dt;

          if (p.strobe && Math.sin(clock * 0.45 + (p.phase || 0)) < 0) ctx.globalAlpha *= 0.15;
          if (p.crossette && !p.split && p.life <= p.max * 0.55) {
            p.split = true; const baseAngle = Math.atan2(p.vy, p.vx);
            for (let k = 0; k < 4; k++) {
              const ca = baseAngle + (k * Math.PI / 2), cs = R(3.2, 5.2);
              particle(p.x, p.y, Math.cos(ca) * cs, Math.sin(ca) * cs, p.color, R(35, 50), p.size * 0.8, 0.035);
            }
            soundEffect('bestCrackle');
          }
          if (p.willow && Math.random() < 0.32 && particles.length < 2400) {
            particle(p.x + R(-1, 1), p.y + R(-1, 1), p.vx * 0.05, p.vy * 0.05, gold[Math.floor(R(0, 4))], R(14, 28), 0.9, 0.02);
          }
          if (p.crackle && !p.popped && p.life <= 10) {
            p.popped = true;
            for (let k = 0; k < 3; k++) {
              const ca = R(0, Math.PI * 2);
              particle(p.x, p.y, Math.cos(ca) * R(1.2, 2.8), Math.sin(ca) * R(1.2, 2.8), gold[k % 4], R(8, 16), 0.85, 0.03);
            }
            if (Math.random() < 0.28) soundEffect('bestCrackle');
          }
          if (p.smoke) {
            ctx.save(); ctx.globalAlpha = Math.max(0, p.life / p.max) * 0.085; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 + (1 - p.life / p.max) * 2.5), 0, Math.PI * 2); ctx.fill(); ctx.restore();
            continue;
          }
          ctx.globalAlpha = Math.max(0, p.life / p.max) * (p.life < 20 ? R(0.6, 1) : 1);
          ctx.shadowBlur = 0; ctx.strokeStyle = p.color; ctx.lineWidth = p.size;
          ctx.beginPath(); ctx.moveTo(p.px - p.vx * 0.8, p.py - p.vy * 0.8); ctx.lineTo(p.x, p.y); ctx.stroke();
          ctx.drawImage(sprite(p.color), p.x - p.size * 3, p.y - p.size * 3, p.size * 6, p.size * 6);
        }

        particles = particles.filter(p => p.life > 0);
        
        // Draw floating texts (e.g., Happy Diwali 2083)
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.life -= dt;
          const alpha = Math.max(0, ft.life / ft.maxLife);
          ctx.save();
          ctx.font = `bold ${Math.min(56, W * 0.1)}px 'Yatra One', 'Rozha One', serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = `rgba(255, 220, 100, ${alpha})`;
          ctx.shadowColor = "#ff4500";
          ctx.shadowBlur = 25;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
          if (ft.life <= 0) floatingTexts.splice(i, 1);
        }

        ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
        syncStage();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      // Card Click Handlers
      document.querySelectorAll('[data-kind]').forEach(b => {
        b.onclick = async () => {
          await unlockAudio();
          if (lightAllRunning) {
            lightAllAbortId++; lightAllRunning = false;
            const allBtn = document.querySelector('#all');
            if (allBtn) { allBtn.disabled = false; allBtn.classList.remove('lighting'); allBtn.textContent = 'Light them all'; }
          }
          launch(b.dataset.kind);
        };
      });

      const DURATION_BY_KIND = { jhirjhire: 3100, fountain: 3600, spinner: 3100, rocket: 3200, firework: 4300, skyshots: 3600, 'best-fireworks': 8400, 'happy-diwali': 4500 };
      const allBtn = document.querySelector('#all');

      async function runLightThemAll() {
        if (lightAllRunning) return;
        lightAllRunning = true;
        const currentRunId = ++lightAllAbortId;
        if (allBtn) { allBtn.disabled = true; allBtn.classList.add('lighting'); allBtn.textContent = 'Lighting all... ✨'; }

        const sequence = ['jhirjhire', 'fountain', 'spinner', 'rocket', 'firework', 'skyshots', 'best-fireworks', 'happy-diwali'];
        for (let i = 0; i < sequence.length; i++) {
          if (lightAllAbortId !== currentRunId) break;
          launch(sequence[i]);
          await new Promise(resolve => setTimeout(resolve, DURATION_BY_KIND[sequence[i]] || 3500));
        }

        if (lightAllAbortId === currentRunId) {
          lightAllRunning = false;
          if (allBtn) { allBtn.disabled = false; allBtn.classList.remove('lighting'); allBtn.textContent = 'Light them all'; }
          syncStage();
        }
      }

      if (allBtn) {
        allBtn.onclick = async () => { await unlockAudio(); runLightThemAll(); };
      }

      // Sound Toggle Switch
      const soundBtn = document.querySelector('#sound');
      if (soundBtn) {
        soundBtn.onclick = async () => {
          sound = !sound;
          soundBtn.setAttribute('aria-checked', sound.toString());
          const label = soundBtn.querySelector('.sound-label');
          if (label) label.textContent = sound ? 'Sound On' : 'Sound Off';
          if (sound) await unlockAudio();
          if (master && audio) master.gain.setTargetAtTime(sound ? 0.8 : 0, audio.currentTime, 0.025);
        };
      }

      // Visibility Change Clean Handling
      document.addEventListener('visibilitychange', () => {
        previous = 0;
        if (document.hidden) {
          lightAllAbortId++; lightAllRunning = false; bestSalvoAbortId++; bestSalvoRunning = false;
          const bestBtn = document.querySelector('[data-kind="best-fireworks"]');
          if (bestBtn) { bestBtn.disabled = false; bestBtn.textContent = 'Launch'; }
          if (allBtn) { allBtn.disabled = false; allBtn.classList.remove('lighting'); allBtn.textContent = 'Light them all'; }
          queue = []; effects = []; particles = []; flashes = []; floatingTexts = []; audioUntil = 0;
          stage.classList.remove('active');
          if (audio && audio.state === 'running') audio.suspend();
        } else if (audio && sound) {
          audio.resume().catch(() => {});
        }
      });
    })();
  </script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(registration) {
            if (registration && typeof registration.update === 'function') {
              registration.update().catch(function() {});
            }
          })
          .catch(function(err) {
            console.debug('Cache Service Worker registration skipped:', err);
          });
      });
    }
  </script>
